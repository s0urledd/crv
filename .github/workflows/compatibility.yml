name: Splice compatibility watch

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Exact Splice release tag; blank selects the newest tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: splice-compatibility-watch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUESTED_VERSION: ${{ inputs.version || '' }}
      CRV_COMPAT_EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install bench dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep
          npm ci
      - name: Verify newest compatibility
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            ./scripts/compatibility-watch.sh "$REQUESTED_VERSION"
          else
            ./scripts/compatibility-watch.sh
          fi
      - name: Upload reviewed compatibility candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-candidate
          path: compatibility.json
          retention-days: 14
      - name: Clean up disposable resources
        if: always()
        run: |
          if [[ -d .crv-bench/cn-quickstart/.git ]]; then
            ./scripts/stop.sh || true
          fi
          docker ps -aq --filter label=crv.run | xargs -r docker rm -f
          docker network ls -q --filter label=crv.run | xargs -r docker network rm
          docker volume ls -q --filter label=crv.run | xargs -r docker volume rm
